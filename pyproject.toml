[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geonetworkx"
version = "0.5.3"
description = "Python tools for geographic graphs"
readme = "README.md"
license = { file = "LICENCE" }
authors = [
    { name = "Hugo Chareyre - Artelys", email = "hugo.chareyre@artelys.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3"
dependencies = [
    "pyproj>=2.2",
    "geopy>=1.12.0",
    "geopandas>=0.7",
    "networkx>=2.3",
    "numpy>=1.12.0",
    "pandas>=0.25.0",
    "shapely>=1.2.18",
    "scipy>=0.19.0rc2",
    "nose>=1.3.7",
]

[tool.setuptools.packages.find]
where = ["."]